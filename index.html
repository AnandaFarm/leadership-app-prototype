<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>html,body{min-height:100%}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Ananda Farm Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* ---------------------------------------------------------------
   Ananda Farm design tokens — copied from app/src/styles/tokens.css
   --------------------------------------------------------------- */
:root {
  --deep-palm:#1f4a2e; --palm-green:#3e7c4a; --sunflower-gold:#f2b830; --farm-cream:#fbf6e9;
  --ink:#1f2a22; --muted:#6b7a6e; --muted-2:#4a5a4e; --muted-3:#8a968d; --line:#ede7d6;
  --warn:#b85c1e; --warn-deep:#8a3f12; --gold-deep:#7a5a0c; --gold-ink:#5a4a14; --star-stroke:#b8860b; --orange:#e08a3c;
  --card:#ffffff; --sand:#f4f0e4; --mint:#eaf3ec; --mint-2:#d9e2db; --mint-text:#c9d8cc; --peach:#fdf0e6; --butter:#fbf0d4;
  --shadow-card:0 1px 2px rgba(31,42,34,.06); --shadow-hero:0 6px 18px rgba(31,74,46,.18);
  --radius-card:16px; --radius-hero:20px; --radius-tile:12px;
  --font-display:'Fredoka','Nunito Sans','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --page-max:430px; --tabbar-h:72px;
  /* prototype chrome only */
  --stage:#16321f; --stage-2:#1f4a2e; --stage-line:rgba(251,246,233,.14); --stage-text:#cfe0d3;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--stage); color:var(--ink);
  font-family:var(--font-body); font-size:14px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
a { color:var(--deep-palm); text-decoration:none; }
button, input, select, textarea { font:inherit; color:inherit; }
button { border:0; background:none; padding:0; cursor:pointer; text-align:inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline:2px solid var(--sunflower-gold); outline-offset:2px;
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

/* ---------------- Prototype chrome ---------------- */
.samplebar {
  position:fixed; top:0; left:0; right:0; height:32px; z-index:100;
  background:var(--sunflower-gold); color:var(--deep-palm);
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-size:12px; font-weight:700; line-height:1.2; padding:0 12px; text-align:center;
}
.stage { display:flex; min-height:100vh; min-height:100dvh; padding-top:32px; }
.rail {
  width:264px; flex-shrink:0; background:var(--stage); color:var(--stage-text);
  border-right:1px solid var(--stage-line); padding:24px 18px 32px; overflow-y:auto;
  height:calc(100dvh - 32px); position:sticky; top:32px;
}
.rail__brand { font-family:var(--font-display); font-weight:600; font-size:19px; color:var(--farm-cream); }
.rail__note { font-size:12px; line-height:17px; color:rgba(207,224,211,.72); margin-top:6px; }
.rail__h {
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:rgba(207,224,211,.55); margin:26px 0 8px;
}
.rail__group { display:flex; flex-direction:column; gap:2px; }
.rail__btn {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px; border-radius:9px; font-size:13px; color:var(--stage-text); width:100%; min-height:36px;
}
.rail__btn:hover { background:rgba(251,246,233,.07); }
.rail__btn--on { background:var(--sunflower-gold); color:var(--deep-palm); font-weight:700; }
.rail__who { font-size:11px; color:rgba(207,224,211,.6); }
.rail__btn--on .rail__who { color:rgba(31,74,46,.7); }
.rail__foot { margin-top:28px; font-size:11px; line-height:16px; color:rgba(207,224,211,.5); border-top:1px solid var(--stage-line); padding-top:14px; }

.stage__main {
  flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:28px 24px;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(62,124,74,.55) 0%, rgba(22,50,31,0) 65%),
    var(--stage);
}
.device {
  position:relative; width:100%; max-width:var(--page-max); height:min(880px, calc(100dvh - 88px));
  background:var(--farm-cream); border:9px solid #0e2417; border-radius:40px; overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.42), 0 0 0 1px rgba(251,246,233,.08);
}
.device__scroll { position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; }
@media (max-width:1020px) { .rail { display:none; } }
@media (max-width:760px) {
  .stage__main { padding:0; background:var(--farm-cream); }
  .device { max-width:none; height:calc(100dvh - 32px); border:0; border-radius:0; box-shadow:none; }
}

/* ---------------- App shell (from global.css) ---------------- */
.page { min-height:100%; background:var(--farm-cream); display:flex; flex-direction:column; }
.page-body { display:flex; flex-direction:column; gap:12px; padding:14px 16px calc(var(--tabbar-h) + 16px) 16px; }
.page-body--no-tabs { padding-bottom:24px; }
.card { background:var(--card); border-radius:var(--radius-card); padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-card); }
.card--tight { padding:12px; gap:2px; }
.card--list { padding:0; gap:0; overflow:hidden; }
.card--dark { background:var(--deep-palm); color:var(--farm-cream); box-shadow:none; }
.card--link { cursor:pointer; text-align:left; width:100%; }
.hero { background:var(--deep-palm); border-radius:var(--radius-hero); padding:14px 18px 16px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-hero); color:var(--farm-cream); }
.label { font-size:12px; font-weight:700; color:var(--muted); }
.label--light { color:var(--mint-text); }
.label--gold { color:var(--sunflower-gold); }
.meta { font-size:12px; line-height:16px; color:var(--muted); }
.meta--light { color:var(--mint-text); }
.body { font-size:14px; line-height:20px; color:var(--ink); }
.small { font-size:13px; line-height:18px; color:var(--muted); }
.num-xl { font-family:var(--font-display); font-weight:600; font-size:44px; line-height:48px; font-variant-numeric:tabular-nums; }
.num-lg { font-family:var(--font-display); font-weight:600; font-size:28px; line-height:32px; font-variant-numeric:tabular-nums; }
.num-md { font-family:var(--font-display); font-weight:600; font-size:22px; line-height:26px; font-variant-numeric:tabular-nums; }
.num-sm { font-family:var(--font-display); font-weight:600; font-size:20px; line-height:24px; font-variant-numeric:tabular-nums; }
.pos { color:var(--palm-green); font-weight:700; }
.neg { color:var(--warn); font-weight:700; }
.bold { font-weight:700; }
.nowrap { white-space:nowrap; }
.row { display:flex; flex-direction:row; align-items:center; }
.row--between { justify-content:space-between; }
.row--baseline { align-items:baseline; }
.row--start { align-items:flex-start; }
.row--wrap { flex-wrap:wrap; }
.col { display:flex; flex-direction:column; }
.gap-2{gap:2px}.gap-3{gap:3px}.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.grow { flex:1; min-width:0; }
.right { text-align:right; }
.divider { height:1px; background:var(--line); }
.section-label { font-size:12px; font-weight:700; color:var(--muted); padding:0 4px; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; border-radius:999px; padding:3px 9px; white-space:nowrap; }
.pill--warn { color:var(--warn); background:var(--peach); }
.pill--ok { color:var(--palm-green); background:var(--mint); }
.pill--ok-deep { color:var(--deep-palm); background:var(--mint); }
.pill--gold { color:var(--gold-deep); background:var(--butter); }
.pill--muted { color:var(--muted); background:var(--sand); }
.tile { display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:var(--radius-tile); background:var(--sand); }
.list-row { display:flex; flex-direction:row; align-items:center; gap:12px; min-height:52px; padding:0 16px; border-bottom:1px solid var(--line); width:100%; color:inherit; text-align:left; }
.list-row:last-child { border-bottom:0; }
.list-row__title { font-size:14px; font-weight:600; color:var(--ink); }
.list-row__sub { font-size:12px; color:var(--muted); }
.list-row__icon { display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.list-row__body { flex:1; min-width:0; display:flex; flex-direction:column; }
.list-row--btn { cursor:pointer; }
.list-row--btn:active { background:var(--sand); }
.btn { height:48px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:700; padding:0 16px; white-space:nowrap; }
.btn--primary { background:var(--deep-palm); color:var(--farm-cream); }
.btn--gold { background:var(--sunflower-gold); color:var(--deep-palm); }
.btn--outline { background:var(--card); color:var(--deep-palm); border:1.5px solid var(--mint-text); }
.btn--ghost { background:rgba(251,246,233,.14); color:var(--farm-cream); }
.btn--sm { height:36px; border-radius:10px; font-size:13px; padding:0 14px; }
.btn:disabled { opacity:.55; cursor:default; }
.link-btn { display:inline-flex; align-items:center; gap:4px; min-height:44px; font-size:12px; font-weight:700; color:var(--deep-palm); }
.input { height:48px; border-radius:12px; border:1.5px solid var(--mint-text); background:var(--card); padding:0 14px; font-size:16px; width:100%; }
.track { height:8px; background:var(--line); border-radius:4px; position:relative; }
.track__fill { position:absolute; left:0; top:0; height:100%; border-radius:4px; background:var(--palm-green); }
.track__tick { position:absolute; top:-3px; width:2px; height:14px; background:var(--ink); }
.track--thick { height:10px; border-radius:5px; }
.track--thick .track__fill { border-radius:5px; }
.track__fill--over { background:var(--warn); }
.track__fill--gold { background:var(--sunflower-gold); }
</style>
<style>
/* ---------------- Components (from app/src/styles/components.css) ---------------- */
.app-header { display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:12px; padding:22px 20px 12px; background:var(--deep-palm); color:var(--farm-cream); }
.app-header--gold { background:var(--sunflower-gold); color:var(--deep-palm); padding-bottom:14px; }
.app-header--stack { flex-direction:column; align-items:stretch; }
.app-header__row { display:flex; flex-direction:row; align-items:flex-end; justify-content:space-between; gap:12px; }
.app-header__text { display:flex; flex-direction:column; gap:2px; min-width:0; }
.app-header__title { font-family:var(--font-display); font-weight:600; font-size:22px; line-height:26px; color:var(--farm-cream); margin:0; text-wrap:balance; }
.app-header--gold .app-header__title { color:var(--deep-palm); }
.app-header__sub { font-size:13px; line-height:18px; color:var(--mint-text); }
.app-header--gold .app-header__sub { color:var(--gold-ink); }
.app-header__side { display:flex; flex-direction:row; align-items:center; gap:8px; flex-shrink:0; }
.avatar { width:36px; height:36px; border-radius:18px; background:var(--sunflower-gold); color:var(--deep-palm); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:15px; flex-shrink:0; }
.app-header--gold .avatar { background:var(--deep-palm); color:var(--farm-cream); }
.role-switch { height:44px; min-width:44px; max-width:104px; border-radius:10px; padding:0 8px; font-size:12px; font-weight:700; border:1.5px solid rgba(251,246,233,.35); background:rgba(251,246,233,.12); color:var(--farm-cream); appearance:none; -webkit-appearance:none; }
.app-header--gold .role-switch { border-color:rgba(31,74,46,.35); background:rgba(31,74,46,.1); color:var(--deep-palm); }
.role-switch option { color:var(--ink); background:var(--card); }
.header-search { height:44px; border-radius:12px; background:var(--farm-cream); display:flex; align-items:center; gap:10px; padding:0 14px; margin-top:12px; }
.header-search input { flex:1; min-width:0; height:44px; border:0; background:transparent; font-size:14px; color:var(--ink); outline:none; }
.header-search input::placeholder { color:var(--muted-3); }

.tabbar { position:absolute; left:0; right:0; bottom:0; height:var(--tabbar-h); background:var(--card); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:center; padding:0 8px 8px; z-index:10; }
.tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:44px; margin:0 6px; border-radius:12px; font-size:11px; font-weight:600; color:var(--muted-3); }
.tab--active { background:var(--mint); color:var(--deep-palm); font-weight:700; }

.seg { display:inline-flex; background:var(--sand); border-radius:999px; padding:3px; }
.seg--hero { background:rgba(251,246,233,.12); }
.seg__btn { height:30px; padding:0 12px; border-radius:999px; font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; display:flex; align-items:center; }
.seg__btn--on { background:var(--deep-palm); color:var(--farm-cream); }
.seg--hero .seg__btn { color:var(--mint-text); }
.seg--hero .seg__btn--on { background:var(--farm-cream); color:var(--deep-palm); }

.calls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.call { height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:13px; font-weight:700; line-height:15px; padding:0 4px; background:var(--card); color:var(--muted); border:1.5px solid var(--line); }
.call--open { background:var(--mint); color:var(--deep-palm); border-color:var(--palm-green); }
.call--delayed { background:var(--butter); color:var(--gold-deep); border-color:var(--sunflower-gold); }
.call--rainout { background:var(--peach); color:var(--warn-deep); border-color:var(--warn); }

.delta { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; white-space:nowrap; }
.delta--up { color:var(--palm-green); background:var(--mint); }
.delta--down { color:var(--warn); background:var(--peach); }
.delta--flat { color:var(--muted); background:var(--sand); }
.delta--hero { background:rgba(242,184,48,.18); color:var(--sunflower-gold); }
.delta--hero.delta--down { background:rgba(224,138,60,.22); color:#f5c08a; }

.wx-chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; white-space:nowrap; }
.wx-chip--gold { color:var(--sunflower-gold); }
.wx-chip--muted { color:var(--mint-text); }
.wx-chip--pill { background:var(--mint); color:var(--deep-palm); border-radius:999px; padding:6px 12px; font-size:13px; }
.wx-chip--pill.wx-chip--warn { background:var(--peach); color:var(--warn-deep); }
.wx-chip--pill.wx-chip--delayed { background:var(--butter); color:var(--gold-deep); }
.wx-tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 12px; border-radius:12px; background:var(--mint); min-width:76px; }
.wx-tile__big { font-size:12px; font-weight:700; color:var(--deep-palm); }
.wx-tile__sub { font-size:12px; color:var(--muted-2); white-space:nowrap; }

.barstrip { display:flex; gap:3px; align-items:flex-end; height:62px; }
.barstrip__col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
.barstrip__col--hi { gap:2px; }
.barstrip__bar { width:100%; background:rgba(251,246,233,.28); border-radius:4px 4px 0 0; }
.barstrip__col--hi .barstrip__bar { background:var(--sunflower-gold); }
.barstrip__lbl { font-size:11px; color:var(--mint-text); }
.barstrip__col--hi .barstrip__lbl { font-weight:700; color:var(--farm-cream); }
.barstrip__val { font-size:11px; font-weight:700; color:var(--sunflower-gold); }

.curve { display:flex; gap:2px; align-items:flex-end; height:64px; }
.curve__bar { flex:1; background:var(--palm-green); border-radius:4px 4px 0 0; min-height:2px; }
.curve__bar--peak { background:var(--deep-palm); }
.curve__axis { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }

.hours { display:flex; gap:4px; align-items:flex-end; }
.hours__col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.hours__temp { font-size:11px; font-weight:700; color:var(--ink); }
.hours__temp--wet { color:var(--warn); }
.hours__bar { width:100%; height:6px; background:var(--palm-green); border-radius:3px; }
.hours__bar--wet { background:var(--orange); }
.hours__lbl { font-size:12px; color:var(--muted); }

.legend { display:flex; gap:10px; align-items:center; }
.legend__item { display:flex; gap:4px; align-items:center; font-size:12px; color:var(--muted); }
.legend__swatch { width:10px; height:10px; border-radius:2px; }
.zones { display:flex; flex-direction:column; gap:9px; }
.zone { display:flex; align-items:center; gap:10px; min-height:22px; }
.zone__name { width:96px; flex-shrink:0; font-size:13px; font-weight:600; color:var(--ink); }
.zone__bars { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
.zone__bar { height:8px; border-radius:0 4px 4px 0; background:var(--palm-green); min-width:2px; }
.zone__bar--ly { background:var(--mint-2); }
.zone__val { width:58px; text-align:right; font-size:13px; font-weight:700; color:var(--ink); flex-shrink:0; font-variant-numeric:tabular-nums; }
.zone__val--neg { color:var(--warn); }

.labor { display:flex; align-items:center; gap:10px; height:34px; }
.labor__name { width:104px; flex-shrink:0; font-size:13px; font-weight:600; color:var(--ink); }
.labor .track { flex:1; }
.labor__pct { width:40px; text-align:right; font-size:13px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
.labor__pct--over { color:var(--warn); }
.labor__splh { width:44px; text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

.banner { border-radius:var(--radius-card); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; }
.banner__lead { display:flex; align-items:center; gap:10px; min-width:0; }
.banner__text { display:flex; flex-direction:column; gap:2px; min-width:0; }
.banner__title { font-size:14px; font-weight:700; line-height:18px; }
.banner__sub { font-size:12px; line-height:16px; }
.banner--gold { background:var(--sunflower-gold); color:var(--deep-palm); }
.banner--gold .banner__sub { color:var(--muted-2); }
.banner--draft { background:var(--butter); border:1.5px solid var(--sunflower-gold); }
.banner--draft .banner__title { color:var(--gold-deep); }
.banner--draft .banner__sub { color:var(--muted); }
.banner--published { background:var(--mint); border:1.5px solid var(--palm-green); }
.banner--published .banner__title { color:var(--deep-palm); }
.banner--published .banner__sub { color:var(--muted-2); }
.banner--warn { background:var(--peach); align-items:flex-start; justify-content:flex-start; }
.banner--warn .banner__title { font-size:13px; color:var(--warn-deep); }

.banner--pending { border:1.5px dashed var(--mint-text); background:transparent; }
.banner--pending .banner__title { font-size:12px; color:var(--muted); }
.banner--pending .banner__sub { color:var(--muted); }
.banner--dark { background:var(--deep-palm); color:var(--farm-cream); flex-direction:column; align-items:stretch; gap:10px; padding:14px 16px; }

.app-mark { width:28px; height:28px; border-radius:8px; background:var(--sand); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--deep-palm); }
.app-mark--square { background:var(--ink); }
.app-mark--square::before { content:''; width:12px; height:12px; border:2.5px solid #fff; border-radius:2px; }

.pace-tile { display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:12px; background:var(--sand); border:1.5px solid transparent; }
.pace-tile--behind { background:var(--peach); border-color:var(--orange); }
.pace-tile__day { font-size:12px; font-weight:700; color:var(--ink); }

  open:'Saved to today’s season-day record. Owners see "Open as usual" on the cockpit; nothing else is sent.',
  delayed:'Saved. Posts the delayed-opening notice to the channel and tags today so LY comparisons show the delay.',
  rainout:'Saved. Tags today as rained out, excludes it from LY baselines, and alerts Jen and the owners.',
  closed:'Saved. Tags today as closed and excludes it from LY baselines.'};

/* ---------------- mutable prototype state ---------------- */
var S={
  role:'owner', route:'/today',
  seasonDays:{}, notes:NOTES.map(function(n){return Object.assign({},n);}),
  briefs:BRIEFS.map(function(b){return Object.assign({},b);}),
  heroView:'yesterday', ownerView:false, briefId:null, showAllSource:false,
  guideQ:'', allFaq:false, allAttractions:false, fbDept:'fnb',
  noteKind:'log', noteBody:'', noteToStaff:false, toast:null, pushOn:false, seasonView:'revenue'
};
S.seasonDays[TODAY]={day:TODAY,week:4,call:null,calledAt:null};
S.seasonDays[YEST]={day:YEST,week:4,call:'open',calledAt:ET(YEST,'07:28')};
function seasonDay(d){ return S.seasonDays[d]||{day:d,week:seasonWeek(d),call:null,calledAt:null}; }
</script>
<script>
/* ============================ DERIVED ============================ */
function dailyFor(day){ if(day===YEST) return YESTERDAY; if(day===TODAY) return TODAY_SO_FAR;
  var d=DAYS.filter(function(x){return x.day===day;})[0]; return d?{day:d.day,week:d.week,blended_revenue_cents:d.rev,attendance:d.att,
    ly_blended_revenue_cents:d.lyRev,ly_attendance:d.lyAtt,blended_delta_pct:delta(d.rev,d.lyRev),pulled_at:PULLED}:null; }
function recentDays(n){ return DAYS.slice(-n); }
function seasonToDate(){
  var counted=DAYS.filter(function(d){return d.call==='open';});
  var rev=0,att=0,lyRev=0,lyAtt=0,allRev=0,allAtt=0,wx=0;
  DAYS.forEach(function(d){ allRev+=d.rev; allAtt+=d.att; if(d.call!=='open') wx++; });
  counted.forEach(function(d){ rev+=d.rev; att+=d.att; lyRev+=d.lyRev; lyAtt+=d.lyAtt; });
  return {days:DAYS.length,weatherDays:wx,comparableDays:counted.length,rev:allRev,att:allAtt,
    revC:rev,attC:att,lyRev:lyRev,lyAtt:lyAtt,revDelta:delta(rev,lyRev),attDelta:delta(att,lyAtt),through:DAYS[DAYS.length-1].day};
}
function reviewStats(rows){ var rated=rows.filter(function(r){return r.rating!=null;});
  var avg=rated.length?rated.reduce(function(s,r){return s+r.rating;},0)/rated.length:null;
  var lows=rated.filter(function(r){return r.rating<=3;}).sort(function(a,b){return a.rating-b.rating;});
  return {count:rows.length,avg:avg,low:lows.length,awaiting:rows.filter(function(r){return !r.reply;}).length,lowest:lows[0]||null}; }
function reviewsSince(day){ return REVIEWS.filter(function(r){return r.at>=day;}); }
function forecastRange(sold){ var r=function(x){return Math.round(x/100)*100;}; return [r(sold*1.3),r(sold*1.45)]; }
function rainHour(hours,th){ th=th||30; var best=null;
  hours.forEach(function(h){ if(h.prob>=th && h.prob>(best?best.prob:0)) best=h; }); return best; }
function upcomingPacing(){ return PACING.filter(function(p){return p.daysOut>0;}).sort(function(a,b){return a.day<b.day?-1:1;}); }
function notesFor(day,opts){ opts=opts||{}; return S.notes.filter(function(n){
  return n.day===day && (!opts.audience||n.audience.indexOf(opts.audience)>=0) && (!opts.kinds||opts.kinds.indexOf(n.kind)>=0); }); }
function eventsFor(day){ return EVENTS.filter(function(e){return e.start.slice(0,10)===day;}).sort(function(a,b){return a.start<b.start?-1:1;}); }
function shiftsIn(from,to,opts){ opts=opts||{}; return SHIFTS.filter(function(s){
  if(s.day<from||s.day>to) return false;
  if(opts.openOnly) return s.tm===null;
  if(opts.mine) return s.tm===MAYA;
  return true; }).sort(function(a,b){return a.start<b.start?-1:1;}); }
function weekOf(day){ var d=new Date(day+'T12:00:00Z'); var dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow);
  return Array.from({length:7},function(_,i){ var x=new Date(d); x.setUTCDate(d.getUTCDate()+i); return x.toISOString().slice(0,10); }); }
function nextShift(list){ return list.filter(function(s){return new Date(s.end)>NOW;})[0]||null; }
function coworkerLine(names){ if(!names.length) return null;
  var l=names.map(function(n){return n.lead?n.name+' (lead)':n.name;});
  return 'With '+(l.length===1?l[0]:l.slice(0,-1).join(', ')+' and '+l[l.length-1])+'.'; }
function firstClause(t){ if(!t) return null; var s=t.split(/[.!?]/)[0].trim(); return s?s.charAt(0).toLowerCase()+s.slice(1):null; }
function can(role,perm){ var P={'notes.write':['coo','ops','fnb','retail','marketing'],'brief.approve':['coo','marketing'],
  'weather.call':['ops','coo'],'notes.ack':['staff','fnb','retail','ops']}; return P[perm].indexOf(role)>=0; }
function headerLine(day,week,opts){ opts=opts||{}; var p=[dayShort(day)];
  if(week) p.push((opts.withKind?'Fall week ':'Week ')+week);
  if(opts.updatedAt) p.push('updated '+timeShort(opts.updatedAt));
  if(opts.suffix) p.push(opts.suffix); return p.join(' · '); }

/* ============================ SHELL ============================ */
var NAV={
  owner:[['Today','/today','home'],['Season','/season','chart'],['Brief','/brief','doc'],['More','/more','dots']],
  coo:[['Today','/today','home'],['Incidents','/incidents','bookmark'],['Calendar','/calendar','cal'],['Brief','/brief','doc']],
  fnb:[['Today','/today','home'],['Season','/season','chart'],['Log','/log','list'],['Square',LINKS.square,'square',true]],
  retail:[['Today','/today','home'],['Season','/season','chart'],['Log','/log','list'],['Square',LINKS.square,'square',true]],
  marketing:[['Today','/today','home'],['Campaigns','/campaigns','chart'],['Reviews','/reviews','starO'],['Brief','/brief','doc']],
  ops:[['Today','/today','home'],['Incidents','/incidents','bookmark'],['Calendar','/calendar','cal'],['Log','/log','list']],
  staff:[['Shifts','/shifts','cal'],['Today','/staff/today','sun'],['Guide','/staff/guide','book'],['Me','/me','user']]
};
var HOME={owner:'/today',coo:'/today',ops:'/today',fnb:'/today',marketing:'/today',retail:'/today',staff:'/shifts'};
function tone(){ return S.role==='staff'?'gold':'dark'; }

function shell(o){
  var u=USERS[S.role];
  var gold=tone()==='gold';
  return '<div class="page">'+
    '<header class="app-header'+(gold?' app-header--gold':'')+(o.headerExtra?' app-header--stack':'')+'">'+
      '<div class="app-header__row"'+(o.headerExtra?'':' style="display:contents"')+'>'+
        '<div class="app-header__text">'+
          '<h1 class="app-header__title">'+o.title+'</h1>'+
          (o.subtitle!=null?'<div class="app-header__sub">'+o.subtitle+'</div>':'')+
        '</div>'+
        '<div class="app-header__side">'+
          '<select class="role-switch" id="roleSwitch" aria-label="Preview as role">'+
            ALL_ROLES.map(function(r){return '<option value="'+r+'"'+(r===S.role?' selected':'')+'>'+ROLE_LABEL[r]+'</option>';}).join('')+
          '</select>'+
          '<div class="avatar" aria-label="'+esc(u.name)+'">'+initials(u.name)+'</div>'+
        '</div>'+
      '</div>'+ (o.headerExtra||'') +
    '</header>'+
    '<main class="page-body'+(o.noTabs?' page-body--no-tabs':'')+'">'+o.body+'</main>'+
  '</div>';
}
function renderTabs(){
  var tabs=NAV[S.role]||[];
  document.getElementById('tabbar').innerHTML=tabs.map(function(t){
    var on=!t[3]&&(S.route===t[1]||(t[1]!=='/today'&&S.route.indexOf(t[1])===0));
    var icon=I[t[2]]({size:22,strokeWidth:on?2.2:2});
    if(t[3]) return '<a class="tab" href="'+t[1]+'" target="_blank" rel="noopener noreferrer">'+icon+'<span>'+t[0]+'</span></a>';
    return '<button type="button" class="tab'+(on?' tab--active':'')+'" data-go="'+t[1]+'">'+icon+'<span>'+t[0]+'</span></button>';
  }).join('');
}

/* -------- little builders -------- */
function card(inner,cls,style){ return '<section class="card'+(cls?' '+cls:'')+'"'+(style?' style="'+style+'"':'')+'>'+inner+'</section>'; }
function cardHead(label,right){ return '<div class="row row--between"><div class="label">'+label+'</div>'+
  (right!=null?'<div class="meta">'+right+'</div>':'')+'</div>'; }
function statTile(label,value,sub,size){
  var lg=size==='lg';
  return '<section class="card'+(lg?' gap-4':' card--tight')+'"><div class="label">'+label+'</div>'+
    '<div class="'+(lg?'num-lg':'num-sm')+'">'+value+'</div>'+
    (sub!=null?'<div class="'+(lg?'meta':'meta bold')+'"'+(lg?'':' style="font-size:11px"')+'>'+sub+'</div>':'')+'</section>';
}
function deltaPill(ratio,ly,hero,fmtKind){
  if(ratio==null) return '<span class="delta delta--flat'+(hero?' delta--hero':'')+'">no LY</span>';
  var up=ratio>0.0005, down=ratio<-0.0005;
  var cls='delta '+(up?'delta--up':down?'delta--down':'delta--flat')+(hero?' delta--hero':'');
  var lyText = ly==null?null:(fmtKind==='int'?int(ly):moneyShort(ly));
  var arrow = up?I.up({size:12}):down?I.down({size:12}):'';
  var txt = hero ? pctSigned(ratio).replace(/^[+−]/,'') : pctSigned(ratio);
  return '<span class="'+cls+'">'+arrow+'<span>'+txt+(lyText?' · LY '+lyText:'')+'</span></span>';
}
function deltaText(ratio,suffix){ if(ratio==null) return '<span style="color:var(--muted)">—</span>';
  return '<span class="'+(ratio>=0?'pos':'neg')+'">'+pctSigned(ratio)+(suffix||'')+'</span>'; }
function wxIconFor(call,prob){ if(call==='rainout'||call==='closed') return I.rain; if(call==='delayed') return I.cloud;
  if((prob||0)>=50) return I.rain; return I.sun; }
function wxChip(call,prob,toneKind,label){
  var Icon=wxIconFor(call,prob);
  var text=label||(call?WEATHER_CALL_LABEL[call]:'Not called yet');
  var variant=(call==='rainout'||call==='closed')?'wx-chip--warn':call==='delayed'?'wx-chip--delayed':'';
  var cls='wx-chip '+(toneKind==='gold'?'wx-chip--gold':toneKind==='pill'?'wx-chip--pill '+variant:'wx-chip--muted');
  return '<span class="'+cls+'">'+Icon({size:16,strokeWidth:2.2})+'<span>'+text+'</span></span>';
}
function banner(o){
  var inner='<div class="banner__lead">'+(o.icon||'')+'<div class="banner__text"><div class="banner__title">'+o.title+'</div>'+
    (o.sub!=null?'<div class="banner__sub">'+o.sub+'</div>':'')+'</div></div>'+(o.right||'');
  var cls='banner banner--'+o.tone;
  if(o.go) return '<button type="button" class="'+cls+'" data-go="'+o.go+'">'+inner+'</button>';
  return '<div class="'+cls+'">'+inner+'</div>';
}
function warnBanner(title,text){ return '<div class="banner banner--warn">'+
  I.alert({size:18,color:'var(--warn)',strokeWidth:2.2,style:'flex-shrink:0;margin-top:1px'})+
  '<div class="banner__text"><div class="banner__title">'+title+'</div><div class="banner__sub">'+text+'</div></div></div>'; }
function listRow(o){
  var inner=(o.icon?'<span class="list-row__icon">'+o.icon+'</span>':'')+
    '<span class="list-row__body"><span class="list-row__title">'+o.title+'</span>'+
    (o.sub!=null?'<span class="list-row__sub">'+o.sub+'</span>':'')+'</span>'+(o.right||'');
  if(o.href) return '<a class="list-row list-row--btn" href="'+o.href+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>';
  if(o.go) return '<button type="button" class="list-row list-row--btn" data-go="'+o.go+'">'+inner+'</button>';
  if(o.act) return '<button type="button" class="list-row list-row--btn" data-act="'+o.act+'">'+inner+'</button>';
  return '<div class="list-row">'+inner+'</div>';
}
function extLink(href,text,light){ return '<a class="ext'+(light?' ext--light':'')+'" href="'+href+'" target="_blank" rel="noopener noreferrer"><span>'+text+'</span>'+I.ext({size:14})+'</a>'; }
function laborRow(name,p,target,right,scaleMax){
  scaleMax=scaleMax||0.4; var over=p!=null&&p>target;
  var w=p==null?0:Math.min(100,Math.round(p/scaleMax*100));
  return '<div class="labor"><div class="labor__name">'+name+'</div>'+
    '<div class="track"><div class="track__fill'+(over?' track__fill--over':'')+'" style="width:'+w+'%"></div>'+
    '<div class="track__tick" style="left:'+Math.round(target/scaleMax*100)+'%"></div></div>'+
    '<div class="labor__pct'+(over?' labor__pct--over':'')+'">'+(p==null?'—':Math.round(p*100)+'%')+'</div>'+
    (right!=null?'<div class="labor__splh">'+right+'</div>':'')+'</div>';
}
function segmented(opts,value,act,hero){
  return '<div class="seg'+(hero?' seg--hero':'')+'" role="tablist">'+opts.map(function(o){
    return '<button type="button" role="tab" aria-selected="'+(o[0]===value)+'" class="seg__btn'+(o[0]===value?' seg__btn--on':'')+
      '" data-act="'+act+'" data-val="'+o[0]+'">'+o[1]+'</button>'; }).join('')+'</div>';
}
function zoneBars(rows,legend){
  var max=Math.max.apply(null,[1].concat(rows.map(function(r){return r.now;})).concat(rows.map(function(r){return r.ly||0;})));
  return (legend?'<div class="legend"><div class="legend__item"><span class="legend__swatch" style="background:var(--palm-green)"></span>'+legend[0]+'</div>'+
    '<div class="legend__item"><span class="legend__swatch" style="background:var(--mint-2)"></span>'+legend[1]+'</div></div>':'')+
    '<div class="zones">'+rows.map(function(r){
      return '<div class="zone"><div class="zone__name">'+esc(r.name)+'</div><div class="zone__bars">'+
        '<div class="zone__bar" style="width:'+Math.round(r.now/max*100)+'%"></div>'+
        '<div class="zone__bar zone__bar--ly" style="width:'+Math.round((r.ly||0)/max*100)+'%"></div></div>'+
        '<div class="zone__val'+(r.negative?' zone__val--neg':'')+'">'+r.valueLabel+'</div></div>';
    }).join('')+'</div>';
}
function pacingTable(rows,title){
  var max=Math.max.apply(null,[1].concat(rows.map(function(r){return r.sold;})).concat(rows.map(function(r){return r.lySold||0;})));
  var anchored=rows.filter(function(r){return r.anchor&&r.lyDay;});
  if(!rows.length) return card(cardHead(title)+'<div class="meta">No upcoming operating days with sales yet.</div>');
  return card(cardHead(title)+
    '<div class="pace-grid pace-grid--head"><div>Date</div><div>Pace vs LY</div><div class="right">Sold</div><div class="right">vs LY</div></div>'+
    rows.map(function(r){
      var d=delta(r.sold,r.lySold);
      var friday=new Date(r.day+'T12:00:00Z').getUTCDay()===5;
      var tag=r.anchor?r.anchor.split('-')[0].toUpperCase():null;
      return '<div class="pace-grid'+(friday?' pace-grid--friday':'')+'">'+
        '<div class="pace-grid__day"><span>'+weekdayDay(r.day)+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>'+
        '<div class="pace-grid__bars"><div class="pace-grid__bar" style="width:'+Math.round(r.sold/max*100)+'%"></div>'+
        '<div class="pace-grid__bar pace-grid__bar--ly" style="width:'+Math.round((r.lySold||0)/max*100)+'%"></div></div>'+
        '<div class="pace-grid__num">'+int(r.sold)+'</div>'+
        '<div class="pace-grid__num '+(d==null?'':d>=0?'pos':'neg')+'">'+pctSigned(d)+'</div></div>';
    }).join('')+
    '<div class="meta">Fridays highlighted (our growth lever).'+
      anchored.map(function(r){return ' '+weekdayDay(r.day)+' compares to '+dayShort(r.lyDay)+' LY, '+holidayAnchorLabel(r.anchor).toLowerCase()+'.';}).join('')+
    '</div>','',"gap:8px;padding-bottom:12px");
}
</script>
<script>
/* ============================ SCREENS ============================ */
function ownerCockpit(){
  var u=USERS.owner, first=u.name.split(' ')[0];
  var day=S.heroView==='yesterday'?YEST:TODAY;
  var d=dailyFor(day), sd=seasonDay(day), recent=recentDays(7);
  var std=seasonToDate(), pacing=upcomingPacing().slice(0,3);
  var rv=reviewStats(reviewsSince(addDays(TODAY,-7)));
  var note=notesFor(YEST,{kinds:['log'],audience:'leadership'})[0];

  var lyWx=d.ly_weather_summary?deg(d.ly_feels_like_high_f)+' with '+d.ly_weather_summary:deg(d.ly_feels_like_high_f);
  var nowWx=S.heroView==='yesterday'
    ? 'Yesterday: feels like '+deg(d.feels_like_high_f)+', '+(d.precip_in?d.precip_in+'" rain':'no rain')+'.'
    : 'Today: feels like '+deg(d.feels_like_high_f)+(d.weather_summary?', '+d.weather_summary.replace(/^Partly sunny, /,''):'')+'.';
  var maxBar=Math.max.apply(null,recent.map(function(r){return r.rev;}));
  var lastDay=recent[recent.length-1].day;

  var hero='<section class="hero">'+
    '<div class="row row--between gap-10">'+
      segmented([['yesterday','Yesterday'],['today','Today so far']],S.heroView,'heroView',true)+
      wxChip(sd.call,null,sd.call?'gold':'muted')+
    '</div>'+
    '<div class="col gap-4">'+
      '<div class="label label--light">Blended revenue · tickets, F&amp;B, retail, Barn deposits</div>'+
      '<div class="row row--baseline gap-12 row--wrap">'+
        '<div class="num-xl" style="color:var(--farm-cream)">'+money(d.blended_revenue_cents)+'</div>'+
        (S.heroView==='yesterday'
          ? deltaPill(d.blended_delta_pct,d.ly_blended_revenue_cents,true)
          : '<span class="delta delta--hero">'+int(d.tickets_sold)+' advance sold · LY day '+money(d.ly_blended_revenue_cents)+'</span>')+
      '</div>'+
      '<div class="meta meta--light">'+comparablePhrase(d.day,d.week,null)+' · '+lyWx+'. '+nowWx+'</div>'+
    '</div>'+
    '<div class="barstrip" role="img" aria-label="Blended revenue, last 7 operating days">'+
      recent.map(function(r){ var hi=r.day===lastDay;
        return '<div class="barstrip__col'+(hi?' barstrip__col--hi':'')+'">'+
          (hi?'<div class="barstrip__val">'+moneyShort(r.rev)+'</div>':'')+
          '<div class="barstrip__bar" style="height:'+Math.max(4,Math.round(r.rev/maxBar*40))+'px"></div>'+
          '<div class="barstrip__lbl">'+weekday(r.day)+'</div></div>';
      }).join('')+
    '</div></section>';

  var tiles='<div class="grid-2">'+
    statTile('Attendance',int(d.attendance),'redeemed · LY '+int(d.ly_attendance)+' '+deltaText(d.attendance_delta_pct),'lg')+
    statTile('Per cap',moneyExact(d.per_cap_cents),'F&amp;B + retail · LY '+moneyExact(d.ly_per_cap_cents)+' '+deltaText(delta(d.per_cap_cents,d.ly_per_cap_cents)),'lg')+
  '</div>';

  var stdCard='<button type="button" class="card card--link" data-go="/season" style="flex-direction:row;justify-content:space-between;align-items:center;padding:12px 16px">'+
    '<span class="col gap-2"><span class="label">Season to date</span>'+
    '<span class="small">'+std.days+' operating days · '+std.weatherDays+' weather day'+(std.weatherDays===1?'':'s')+'</span></span>'+
    '<span class="col gap-2" style="align-items:flex-end"><span class="num-md">'+moneyShort(std.rev)+'</span>'+
    '<span class="meta bold '+(std.revDelta>=0?'pos':'neg')+'">'+pctSigned(std.revDelta)+' vs the same '+std.comparableDays+' days LY</span></span></button>';

  var pace=card(cardHead('Next weekend pacing',Math.max.apply(null,pacing.map(function(p){return p.daysOut;}))+' days out')+
    '<div class="grid-3">'+pacing.map(function(p){
      var dd=delta(p.sold,p.lySold), behind=dd!=null&&dd<0, prob=p.forecast?p.forecast.prob:null;
      var Icon=wxIconFor(null,prob);
      return '<div class="pace-tile'+(behind?' pace-tile--behind':'')+'">'+
        '<div class="row row--between"><span class="pace-tile__day">'+weekdayDay(p.day)+'</span>'+
        Icon({size:16,color:behind?'var(--warn)':'var(--star-stroke)'})+'</div>'+
        '<div class="pace-tile__num">'+int(p.sold)+'</div>'+
        '<div class="pace-tile__sub">LY '+int(p.lySold)+' · <span class="'+(behind?'neg':'pos')+'">'+
        (behind?'behind':'ahead')+(behind&&prob&&prob>=30?', '+prob+'% rain':'')+'</span></div></div>';
    }).join('')+'</div>','','padding-bottom:12px');

  var rvCard=card('<div class="row row--between"><div class="row gap-8">'+star(18)+
    '<span class="bold nowrap">'+(rv.avg!=null?rv.avg.toFixed(1):'—')+' this week</span>'+
    '<span class="small nowrap">· '+rv.count+' new</span></div>'+
    (rv.low>0?'<span class="pill pill--warn">'+rv.low+' at '+rv.lowest.rating+' stars</span>':'')+'</div>'+
    (note?'<div class="divider"></div><div class="col gap-4"><div class="label">Note from '+esc(note.author)+' · '+timeShort(note.at)+'</div>'+
      '<div class="body">'+esc(note.body)+'</div></div>':''));

  return shell({title:greeting(NOW)+', '+first,
    subtitle:headerLine(TODAY,4,{updatedAt:YESTERDAY.pulled_at,withKind:true}),
    body:hero+tiles+stdCard+pace+rvCard});
}

function opsBoard(){
  var d=YESTERDAY, zones=ZONES_FNB, inc=INCIDENTS.filter(function(i){return i.status!=='closed';});
  var staffing={scheduled:61,clocked:58};
  var wx=FORECASTS[TODAY], rain=rainHour(HOURLY_WX);
  var todayPace=PACING.filter(function(p){return p.day===TODAY;})[0];
  var draft=S.briefs.filter(function(b){return b.status==='draft';})[0];
  var range=todayPace?forecastRange(todayPace.sold):null;
  var WxIcon=wxIconFor(null,wx.prob);

  var body='';
  if(draft) body+=banner({tone:'gold',icon:I.doc({size:22,strokeWidth:2.2}),go:'/brief/'+draft.id,
    title:'Weekly recap draft is ready',
    sub:'Week '+draft.week+' · drafted '+weekday(draft.draftedAt)+' · owners see it after you approve',
    right:'<span class="btn btn--primary btn--sm">Review</span>'});

  body+='<div class="grid-3">'+

function opsToday(){
  var sd=seasonDay(TODAY), call=sd.call, calledAt=sd.calledAt;

  var strip=HOURLY_WX.filter(function(h){ return [9,11,13,15,17].indexOf(farmHour(h.hour))>=0; });
  var pace=PACING.filter(function(p){return p.day===TODAY;})[0];
  var share=Math.min(1,pace.sold/DESIGN_DAY), range=forecastRange(pace.sold);
  var todayInc=INCIDENTS.filter(function(i){return i.at.slice(0,10)===TODAY;});
  var openBefore=INCIDENTS.filter(function(i){return i.status!=='closed'&&i.at.slice(0,10)!==TODAY;});
  var mins=7*60+30-(7*60+24);
  var due=call&&calledAt?'called '+timeShort(calledAt):(mins>0?'due in '+mins+' min':'past 7:30');

  var body=card(cardHead('7:30 am weather call',due)+
    '<div class="calls" role="radiogroup" aria-label="Weather call">'+
      ['open','delayed','rainout'].map(function(c){
        return '<button type="button" role="radio" aria-checked="'+(call===c)+'"'+(canCall?'':' disabled')+

      }).join('')+'</div>'+
    '<div class="meta">'+WEATHER_CALL_NOTE[call||'unset']+(canCall?'':' Only ops and the COO can make the call.')+'</div>'+
    '<div class="divider"></div>'+

        return '<div class="hours__col"><div class="hours__temp'+(wet?' hours__temp--wet':'')+'">'+deg(h.feels)+'</div>'+
          '<div class="hours__bar'+(wet?' hours__bar--wet':'')+'"></div><div class="hours__lbl">'+hourLabel(h.hour,'short')+'</div></div>';
      }).join('')+'</div>'+
    '<div class="meta">Feels-like by hour · orange = 30%+ rain chance ('+hourLabel(rain.hour)+', '+rain.prob+'%) · no NWS alerts for our point</div>');

  body+=card('<div class="row row--between row--baseline"><div class="label">Tickets for today</div>'+
      '<div class="meta">same '+weekday(TODAY,'long')+' LY: '+int(pace.lyAtt)+' through gate</div></div>'+
    '<div class="row row--baseline gap-12"><div class="num-lg" style="font-size:32px;line-height:36px">'+int(pace.sold)+'</div>'+
      '<div class="small">advance sold · <span class="'+(delta(pace.sold,pace.lySold)>=0?'pos':'neg')+'">'+
      pctSigned(delta(pace.sold,pace.lySold))+' vs LY at 7 am</span></div></div>'+
    '<div class="row gap-10"><div class="track track--thick grow"><div class="track__fill track__fill--gold" style="width:'+Math.round(share*100)+'%"></div></div>'+
      '<div class="meta bold nowrap" style="color:var(--ink)">'+Math.round(share*100)+'% of design day</div></div>'+
    '<div class="meta">Design day = average of our top 20 days ('+int(DESIGN_DAY)+' guests). Expect '+int(range[0])+'–'+int(range[1])+' with walk-ups.</div>');

  body+=card('<div class="label">Today’s schedule</div>'+
    eventsFor(TODAY).filter(function(e){return e.kind!=='press';}).map(function(e){
      return '<div class="sched"><div class="sched__time">'+clock(e.start)+'</div><div class="sched__text">'+esc(e.title)+'</div></div>';
    }).join(''),'','gap:8px');

  body+='<div class="grid-2">'+
    '<button type="button" class="card card--link" data-go="/incidents" style="padding:14px;gap:6px">'+
      '<span class="label">Incidents</span><span class="num-md" style="font-size:24px;line-height:28px">'+todayInc.length+' today</span>'+
      '<span class="meta">'+openBefore.length+' open from '+(openBefore[0]?weekday(openBefore[0].at,'long'):'earlier')+'</span></button>'+
    '<button type="button" class="card card--link card--dark" data-go="/log" style="padding:14px;gap:6px;justify-content:center">'+
      '<span class="row gap-8">'+I.plus({size:18,color:'var(--farm-cream)',strokeWidth:2.2})+
      '<span class="bold" style="color:var(--farm-cream)">Log entry</span></span>'+
      '<span class="meta meta--light">Shift note, 86’d item, maintenance</span></button>'+
  '</div>';

  return shell({title:'Today on the farm',subtitle:headerLine(TODAY,4,{suffix:timeShort(NOW)}),body:body});
}

<script>
function fbZones(dept){
  var copy=dept==='fnb'
    ? {title:'Food & beverage',net:'F&B net',hourly:'F&B sales by hour'}
    : {title:'Retail',net:'Retail net',hourly:'Retail sales by hour'};
  var day=YEST, d=YESTERDAY;
  var zones=dept==='fnb'?ZONES_FNB:ZONES_RETAIL;
  var hourly=dept==='fnb'?HOURLY_FNB:HOURLY_RETAIL;
  var items=dept==='fnb'?TOP_FNB:TOP_RETAIL;
  var net=dept==='fnb'?d.fnb_net_cents:d.retail_net_cents;
  var lyNet=dept==='fnb'?d.ly_fnb_net_cents:d.ly_retail_net_cents;
  var guests=d.attendance, perCap=Math.round(net/guests), lyPerCap=Math.round(lyNet/d.ly_attendance);
  var orders=zones.reduce(function(a,z){return a+z.orders;},0);
  var discounts=zones.reduce(function(a,z){return a+z.disc;},0);
  var refunds=zones.reduce(function(a,z){return a+z.refunds;},0);
  var below=zones.filter(function(z){return z.delta<0;});
  var peak=hourly.reduce(function(p,h){return !p||h.net>p.net?h:p;},null);
  var maxHour=Math.max.apply(null,hourly.map(function(h){return h.net;}));
  var wd=weekday(day);
  var zoneInc=INCIDENTS.filter(function(i){ return i.at.slice(0,10)===day && i.loc && zones.some(function(z){return i.loc.indexOf(z.zone)>=0;}); });

  var body='<div class="grid-3">'+
    statTile(copy.net,moneyShort(net),'<span class="'+(delta(net,lyNet)>=0?'pos':'neg')+'">'+pctSigned(delta(net,lyNet))+' LY</span>')+
    statTile('Per cap',moneyExact(perCap),'<span class="'+(delta(perCap,lyPerCap)>=0?'pos':'neg')+'">LY '+moneyExact(lyPerCap)+'</span>')+
    statTile('Txns / guest',(orders/guests).toFixed(2),int(orders)+' orders')+
  '</div>';

  body+=card('<div class="row row--between"><div class="label">Net sales by zone</div>'+
      '<div class="legend"><div class="legend__item"><span class="legend__swatch" style="background:var(--palm-green)"></span>'+wd+'</div>'+
      '<div class="legend__item"><span class="legend__swatch" style="background:var(--mint-2)"></span>Same '+wd+' LY</div></div></div>'+
    zoneBars(zones.map(function(z){ return {name:z.zone,now:z.net,ly:z.ly,valueLabel:moneyShort(z.net),negative:z.delta<0}; }))+
    '<div class="meta">'+
      (below.length===0?'Every zone is ahead of its comparable day.'
        :below.length===1?esc(below[0].zone)+' is the only zone below its comparable day ('+pctSigned(below[0].delta)+').'
        :below.map(function(z){return esc(z.zone);}).join(' and ')+' are below their comparable day.')+
      zoneInc.map(function(i){ return ' '+esc(i.summary.split(' ').slice(0,5).join(' '))+' incident filed '+timeShort(i.at)+'.'; }).join('')+
    '</div>'+
    '<div class="row" style="justify-content:flex-end">'+extLink(LINKS.items,'Item detail in Square')+'</div>','','padding-bottom:12px');

  body+=card(cardHead(copy.hourly,'peak '+hourLabel(peak.hour)+' · '+moneyShort(peak.net))+
    '<div class="curve" role="img" aria-label="'+copy.hourly+'">'+
      hourly.map(function(h){ return '<div class="curve__bar'+(h===peak?' curve__bar--peak':'')+
        '" style="height:'+Math.max(2,Math.round(h.net/maxHour*56))+'px"></div>'; }).join('')+'</div>'+
    '<div class="curve__axis">'+hourly.filter(function(_,i){return i%2===0||i===hourly.length-1;})
      .map(function(h){return '<span>'+hourLabel(h.hour,'short')+'</span>';}).join('')+'</div>','','gap:8px;padding-bottom:12px');

  body+='<div class="grid-2">'+
    card('<div class="label">Top items</div>'+items.map(function(it){
      return '<div class="kv"><span class="kv__k">'+esc(it.name)+'</span><span class="kv__v">'+int(it.qty)+'</span></div>'; }).join(''),'','padding:14px;gap:8px')+
    card('<div class="label">Discounts &amp; refunds</div>'+
      '<div class="kv"><span class="kv__k">Discounts</span><span class="kv__v">'+moneyShort(discounts)+'</span></div>'+
      '<div class="kv"><span class="kv__k">Refunds</span><span class="kv__v">'+moneyShort(refunds)+'</span></div>'+
      '<div class="kv"><span class="kv__k">Orders</span><span class="kv__v">'+int(orders)+'</span></div>'+
      '<div class="kv"><span class="kv__k kv__k--muted">of net</span><span class="kv__v pos">'+pct((discounts+refunds)/net)+'</span></div>','','padding:14px;gap:8px')+
  '</div>';

  return shell({title:copy.title,subtitle:headerLine(day,4,{updatedAt:d.pulled_at}),body:body});
}

      '<span class="col gap-4"><span class="small" style="color:var(--ink)">"'+esc(rv.lowest.body)+'"</span>'+

  '</button>';

  body+=banner({tone:'pending',title:'Google profile performance',

function campaigns(){
  var snap=MARKETING;
  var byCh=function(ch){ return CAMPAIGNS.filter(function(c){return c.ch===ch;}); };
  var maxCpr=Math.max.apply(null,CAMPAIGNS.map(function(c){return c.cpr;}));
  var target=350; // $3.50 ceiling agreed with Jen
  function chCard(ch){
    var rows=byCh(ch), spend=rows.reduce(function(a,c){return a+c.spend;},0), red=rows.reduce(function(a,c){return a+c.red;},0);
    return card('<div class="row row--between row--baseline"><div class="label">'+ch+' · last '+snap.windowDays+' days</div>'+
        '<div class="meta">'+moneyShort(spend)+' spend · '+int(red)+' redemptions</div></div>'+
      rows.map(function(c){
        var over=c.cpr>target, w=Math.round(c.cpr/maxCpr*100);
        return '<div class="camp"><div class="camp__top"><div class="camp__name">'+esc(c.name)+'</div>'+
          '<div class="camp__cpr'+(over?' camp__cpr--over':'')+'">'+moneyExact(c.cpr)+'</div></div>'+
          '<div class="camp__bar"><span class="'+(over?'over':'')+'" style="width:'+w+'%"></span></div>'+
          '<div class="camp__meta"><span>'+moneyShort(c.spend)+' spend · '+int(c.red)+' redemptions</span>'+
          '<span>'+(over?'above the $3.50 ceiling':'inside target')+'</span></div></div>';
      }).join(''),'','gap:2px');
  }
  var body=card('<div class="row row--between row--baseline"><div class="label">Cost per redemption · blended</div>'+
      '<div class="meta">bars scale to the worst campaign</div></div>'+
    '<div class="row row--baseline gap-12"><div class="num-lg">'+moneyExact(snap.blendedCpr)+'</div>'+
      '<span class="delta delta--up">'+I.down({size:12})+'<span>'+pctSigned(delta(snap.blendedCpr,snap.priorCpr))+' vs prior 7d</span></span>'+
      '<div class="meta">was '+moneyExact(snap.priorCpr)+'</div></div>'+
    '<div class="meta">A redemption is a scanned ticket, not a checkout — TicketSpice orders are matched to gate scans overnight, so today’s number moves until tomorrow morning.</div>');

  body+=chCard('Meta')+chCard('Google');

  body+=card('<div class="label">Creative · Meta, last 7 days</div>'+
    CREATIVES.map(function(c){
      return '<div class="kv"><span class="kv__k">'+esc(c.name)+'</span>'+
        '<span class="kv__v">'+moneyExact(c.cpr)+'</span></div>'+
        '<div class="meta" style="margin-top:-4px">'+int(c.impr)+' impressions · '+pct(c.ctr,1)+' CTR</div>';
    }).join('<div class="divider" style="margin:4px 0"></div>')+
    '<div class="divider"></div>'+
    '<div class="meta">The "Two weekends left" card is spending at more than double the drone opener. Worth pausing before the Halloween push.</div>','','gap:6px');

  body+=banner({tone:'pending',title:'Live Meta and Google Ads pipelines',
    sub:'These numbers are the last agency export, loaded by hand. Direct API sync lands with request 03.',
    right:'<span class="pill pill--muted">Pending</span>'});

  return shell({title:'Campaigns',subtitle:'Paid social and search · last 7 days',body:body});
}

<script>
function season(){
  var std=seasonToDate();
  var metric=S.seasonView; // 'revenue' | 'attendance'
  var val=function(d){ return metric==='revenue'?d.rev:d.att; };
  var lyVal=function(d){ return metric==='revenue'?d.lyRev:d.lyAtt; };
  var fmtV=function(v){ return metric==='revenue'?moneyShort(v):int(v); };
  var max=Math.max.apply(null,DAYS.map(function(d){return Math.max(val(d),lyVal(d));}));
  var weeks=[1,2,3,4];

  var body=card('<div class="row row--between gap-10">'+
      '<div class="col gap-2"><div class="label">Season to date</div>'+
      '<div class="small">'+std.days+' days open · '+std.weatherDays+' weather day</div></div>'+
      segmented([['revenue','Revenue'],['attendance','Guests']],metric,'seasonView')+
    '</div>'+
    '<div class="grid-2" style="gap:10px">'+
      '<div class="tile"><span class="label">Blended revenue</span><span class="num-md">'+moneyShort(std.rev)+'</span>'+
        '<span class="meta">LY '+moneyShort(std.lyRev)+' '+deltaText(std.revDelta)+'</span></div>'+
      '<div class="tile"><span class="label">Attendance</span><span class="num-md">'+int(std.att)+'</span>'+
        '<span class="meta">LY '+int(std.lyAtt)+' '+deltaText(std.attDelta)+'</span></div>'+
    '</div>'+
    '<div class="meta">Comparisons cover the '+std.comparableDays+' days we were fully open on both sides. Oct 2 was rained out here, so it and its comparable day sit out of the totals above — the grid still shows them.</div>');

  body+=card('<div class="row row--between"><div class="label">Day by day vs the same week last fall</div>'+
      '<div class="legend"><div class="legend__item"><span class="legend__swatch" style="background:var(--palm-green)"></span>2026</div>'+
      '<div class="legend__item"><span class="legend__swatch" style="background:var(--mint-2)"></span>LY</div></div></div>'+
    '<div class="sgrid sgrid--head"><div>Day</div><div>This year vs LY</div><div class="right">'+(metric==='revenue'?'Revenue':'Guests')+'</div><div class="right">vs LY</div></div>'+
    weeks.map(function(w){
      var ds=DAYS.filter(function(d){return d.week===w;});
      if(!ds.length) return '';
      var open=ds.filter(function(d){return d.call==='open';});
      var wv=open.reduce(function(a,d){return a+val(d);},0), wly=open.reduce(function(a,d){return a+lyVal(d);},0);
      return '<div class="wk-head"><span class="wk-head__n">Week '+w+' · '+dateRange(ds[0].day,ds[ds.length-1].day)+'</span>'+
        '<span class="wk-head__v">'+fmtV(wv)+' · '+pctSigned(delta(wv,wly))+' LY</span></div>'+
        ds.map(function(d){
          var dd=d.call==='open'?delta(val(d),lyVal(d)):null;
          var out=d.call!=='open';
          return '<div class="sgrid'+(out?' sgrid--weather':'')+'">'+
            '<div class="sgrid__day">'+weekdayDay(d.day)+(out?' '+I.rain({size:13,color:'var(--warn)'}):'')+'</div>'+
            '<div class="sgrid__bars">'+
              '<div class="sgrid__bar'+(out?' sgrid__bar--out':'')+'" style="width:'+Math.round(val(d)/max*100)+'%"></div>'+
              '<div class="sgrid__bar sgrid__bar--ly" style="width:'+Math.round(lyVal(d)/max*100)+'%"></div></div>'+
            '<div class="sgrid__num">'+fmtV(val(d))+'</div>'+
            '<div class="sgrid__d '+(dd==null?'':dd>=0?'pos':'neg')+'">'+(out?'—':pctSigned(dd))+'</div></div>';
        }).join('')+
        (w<4?'<div class="divider" style="margin:6px 0"></div>':'');
    }).join('')+
    '<div class="meta">Each day compares to the same weekday of the same season week last fall, not the same calendar date — last fall opened a day later. Rained-out days are shaded and excluded from the week and season deltas.</div>',
    '','gap:6px;padding-bottom:14px');

  var best=DAYS.slice().sort(function(a,b){return b.rev-a.rev;})[0];
  var worst=DAYS.filter(function(d){return d.call==='open';}).slice().sort(function(a,b){return delta(a.rev,a.lyRev)-delta(b.rev,b.lyRev);})[0];
  var fridays=DAYS.filter(function(d){return new Date(d.day+'T12:00:00Z').getUTCDay()===5 && d.call==='open';});
  var frNow=fridays.reduce(function(a,d){return a+d.att;},0), frLy=fridays.reduce(function(a,d){return a+d.lyAtt;},0);

  body+=card('<div class="label">What the grid says so far</div>'+
    '<div class="kv"><span class="kv__k">Best day</span><span class="kv__v">'+dayShort(best.day)+' · '+moneyShort(best.rev)+'</span></div>'+
    '<div class="kv"><span class="kv__k">Weakest against LY</span><span class="kv__v">'+dayShort(worst.day)+' · '+pctSigned(delta(worst.rev,worst.lyRev))+'</span></div>'+

function briefApproval(){

  var readOnly=!approver||S.ownerView;
  var rows=b.source, shown=S.showAllSource?rows:rows.slice(0,3);

      '<span class="source-row__v">'+esc(r[1])+'</span></div>'; }).join('')+
    (rows.length>3?'<button type="button" class="link-btn" data-act="toggleSource" style="white-space:normal;text-align:left">'+
      (S.showAllSource?'Show fewer rows':(rows.length-3)+' more rows · the model wrote the words, not the numbers')+'</button>':''),'','gap:6px');

  if(!readOnly && isDraft){
    body+='<div style="display:grid;grid-template-columns:1fr 1.6fr;gap:10px">'+
      '<button type="button" class="btn btn--outline" disabled title="Editing arrives with the next release">Edit draft</button>'+
      '<button type="button" class="btn btn--primary" data-act="approve" data-val="'+b.id+'">'+I.check({size:18})+'<span>Approve and publish</span></button></div>';
  }
  if(!readOnly && !isDraft){
    body+='<div class="col gap-8" style="align-items:center">'+
      '<button type="button" class="btn btn--outline" style="width:100%" data-act="ownerView">Open owner view</button>'+
      '<button type="button" class="link-btn" style="color:var(--muted)" data-act="resetBrief" data-val="'+b.id+'">Reset demo to draft</button></div>';
  }

  }

      others.map(function(o){ return listRow({go:'/brief/'+o.id,
        title:'Week '+o.week+' · '+dateRange(o.start,o.end),sub:esc(o.headline),
        right:'<span class="pill '+(o.status==='published'?'pill--ok':'pill--gold')+'">'+o.status+'</span>'}); }).join('')+
      '</div></div>';
  }

  return shell({title:'Weekly recap · Week '+b.week,
    subtitle:dateRange(b.start,b.end)+' · drafted '+weekdayTime(b.draftedAt),body:body});
}

<script>

function logScreen(){

function incidents(){
  var SEV_PILL={info:'pill--muted',minor:'pill--gold',serious:'pill--warn',critical:'pill--warn'};

    return '<div class="list-row" style="align-items:flex-start;padding:12px 16px">'+
      '<span class="dot '+(i.status==='closed'?'dot--ok':i.confirmed?'dot--gold':'dot--warn')+'"></span>'+
      '<div class="list-row__body gap-4">'+
        '<div class="row row--between gap-8"><span class="list-row__title" style="line-height:18px">'+esc(i.summary)+'</span>'+
        '<span class="pill '+SEV_PILL[i.sev]+'">'+i.sev+(i.confirmed?'':'?')+'</span></div>'+
        '<span class="meta">'+dayShort(i.at)+' '+timeShort(i.at)+' · '+esc(i.by)+' · '+esc(i.loc)+' · via '+i.source+'</span>'+
        (i.details?'<span class="small" style="color:var(--ink)">'+esc(i.details)+'</span>':'')+
        (!i.confirmed&&i.status!=='closed'?'<span class="meta bold" style="color:var(--warn)">Severity needs the COO’s call</span>':'')+
      '</div></div>';
  }
  var open=INCIDENTS.filter(function(i){return i.status!=='closed';});

  var body='<div class="col gap-6"><div class="row row--between" style="padding:0 4px">'+
      '<span class="section-label" style="padding:0">Open</span>'+

    '<div class="card card--list">'+(open.length?open.map(row).join(''):'<div class="list-row"><span class="meta">Nothing open.</span></div>')+'</div></div>';

  body+=card('<div class="meta">Incidents are filed from the ops Log, forwarded emails and the SharePoint form. Closing one happens here once the review flow ships.</div>');
  return shell({title:'Incidents',subtitle:'From the app, email and SharePoint · newest first',body:body});
}

function calendar(){
  var KIND_PILL2={music:'pill--ok',barn:'pill--gold',press:'pill--warn',other:'pill--muted'};
  var days=Array.from({length:8},function(_,i){return addDays(TODAY,i);});
  var groups=days.map(function(d){return {day:d,events:eventsFor(d)};}).filter(function(g){return g.events.length||g.day===TODAY;});
  var body=groups.map(function(g){
    return '<div class="col gap-6"><div class="section-label">'+(g.day===TODAY?'Today · ':'')+dayLong(g.day)+'</div>'+
      '<div class="card card--list">'+(g.events.length?g.events.map(function(e){
        var line=e.timeLabel||(e.end?timeRange(e.start,e.end):clock(e.start));
        return '<div class="list-row" style="min-height:56px">'+
          '<div class="sched__time sched__time--wide">'+line+'</div>'+
          '<div class="list-row__body"><span class="list-row__title">'+esc(e.title)+'</span>'+
          '<span class="list-row__sub">'+[e.loc,e.source].filter(Boolean).join(' · ')+'</span></div>'+

  body+=card('<div class="meta">Events sync from the shared Outlook calendar and HoneyBook. Staff see the ones with a staff note on their Today screen.</div>');
  return shell({title:'Calendar',subtitle:'Outlook, HoneyBook and the farm calendar · next 7 days',body:body});
}

function reviews(){
  var rows=reviewsSince(addDays(TODAY,-14)).slice().sort(function(a,b){return a.at<b.at?1:-1;});
  var st=reviewStats(rows);
  function stars(n){ var out=''; for(var i=0;i<5;i++) out+= i<n?star(14):starEmpty(14); return '<span class="stars" aria-label="'+n+' stars">'+out+'</span>'; }
  var body=card('<div class="row gap-8">'+star(18)+'<span class="bold">'+st.avg.toFixed(1)+' average · '+st.count+' reviews</span></div>'+

    '','flex-direction:row;justify-content:space-between;align-items:center');

function barn(){
