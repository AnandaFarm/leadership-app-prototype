<script>
function staffShifts(){
  var u=USERS.staff, first=u.name.split(' ')[0];
  var mine=shiftsIn(TODAY,addDays(TODAY,14),{mine:true});
  var next=nextShift(mine);
  var week=weekOf(next?next.day:TODAY);
  var all=shiftsIn(week[0],week[6],{});
  var open=shiftsIn(week[0],week[6],{openOnly:true});
  var weekShifts=mine.filter(function(s){return s.day>=week[0]&&s.day<=week[6];});
  var wx=next?FORECASTS[next.day]:null;
  var coworkers=next?all.filter(function(s){return s.day===next.day&&s.zone===next.zone&&s.tm&&s.tm!==next.tm;})
    .map(function(s){return {name:s.name.split(' ')[0],lead:/lead/i.test(s.job||'')};}):[];
  var sold=next?(PACING.filter(function(p){return p.day===next.day;})[0]||{}).sold:null;
  var shiftDays={}; weekShifts.forEach(function(s){shiftDays[s.day]=true;});
  var rest=weekShifts.filter(function(s){return s.day>=TODAY;});
  var WxIcon=wxIconFor(null,wx?wx.prob:null);

  var body='<div class="week" role="list">'+week.map(function(d){
    var isNext=next&&next.day===d;
    return '<div role="listitem" class="week__day'+(shiftDays[d]?' week__day--shift':'')+(isNext?' week__day--next':'')+'">'+
      '<div class="week__name">'+weekday(d)+'</div><div class="week__num">'+Number(d.slice(8))+'</div><div class="week__dot"></div></div>';
  }).join('')+'</div>';

  var line=[coworkerLine(coworkers), sold!=null?(sold>=1500?'Busy day expected: about '+int(Math.round(sold/100)*100)+' advance tickets already sold.':int(sold)+' advance tickets sold so far.'):null]
    .filter(Boolean).join(' ');

  body+='<section class="hero" style="padding:16px 18px">'+
    '<div class="row row--between"><div class="label label--light">Next shift · '+weekday(next.day,'long')+'</div>'+
      '<span class="wx-chip wx-chip--gold">'+WxIcon({size:16,strokeWidth:2.2})+'<span>'+wx.prob+'% rain · '+deg(wx.feels)+'</span></span></div>'+
    '<div class="row row--baseline gap-10"><div class="shift-hero-time">'+clock(next.start)+' – '+clock(next.end)+'</div>'+
      '<div class="small" style="color:var(--mint-text)">'+hoursLen(next.start,next.end)+'</div></div>'+
    '<div class="col gap-4"><div class="bold" style="color:var(--farm-cream)">'+esc(next.zone)+' · '+esc(next.job)+'</div>'+
      '<div class="small" style="color:var(--mint-text)">'+esc(line)+'</div></div>'+
    '<div class="grid-2" style="gap:8px">'+
      '<a class="btn btn--ghost" style="height:44px;font-size:13px" href="'+LINKS.team+'" target="_blank" rel="noopener noreferrer"><span>Swap or drop</span>'+I.ext({size:14})+'</a>'+
      '<button type="button" class="btn btn--gold" style="height:44px;font-size:13px" data-act="addCal">Add to my calendar</button>'+
    '</div></section>';

  if(rest.length) body+='<div class="card card--list">'+rest.map(function(s){
    return '<div class="shift-row"><div class="shift-row__date"><div class="shift-row__wd">'+weekday(s.day)+'</div>'+
      '<div class="shift-row__dn">'+Number(s.day.slice(8))+'</div></div>'+
      '<div class="grow col gap-2"><span class="bold">'+timeRange(s.start,s.end,true)+'</span>'+
      '<span class="meta">'+esc(s.note||(s.zone+' · '+s.job))+'</span></div>'+
      '<span class="pill '+(s.published?'pill--ok':'pill--gold')+'">'+(s.published?'Published':'Draft')+'</span></div>';
  }).join('')+'</div>';

  body+=card(cardHead('Open shifts you could pick up',open.length+' this week')+
    (open.length?open.map(function(s){
      return '<div class="row row--between gap-10" style="min-height:44px">'+
        '<div class="col gap-2"><span class="list-row__title">'+weekdayDay(s.day)+' · '+timeRange(s.start,s.end,true)+'</span>'+
        '<span class="meta">'+esc(s.zone)+' · '+esc(s.job)+'</span></div>'+
        '<a class="btn btn--outline btn--sm" style="height:44px;border-color:var(--palm-green)" href="'+LINKS.team+'" target="_blank" rel="noopener noreferrer">Claim in Square '+I.ext({size:12})+'</a></div>';
    }).join(''):'<div class="meta">None right now.</div>')+
    '<div class="divider"></div>'+
    '<div class="meta">Schedules come from Square Team, updated every 15 minutes. Clock in and out in Square as usual.</div>');

  var sub=[u.zone,u.job,'week of '+dayShort(week[0]).replace(/^\w+, /,'')].join(' · ');
  return shell({title:'Hi '+first,subtitle:sub,body:body});
}

function parseSpecial(body){
  var parts=body.split(' · ').map(function(s){return s.trim();});
  if(parts.length<2) return {name:body,sub:'',price:null};
  var last=parts[parts.length-1], hasPrice=/\$\d/.test(last);
  return {name:parts[0],sub:parts.slice(1,hasPrice?-1:undefined).join(' · '),price:hasPrice?last:null};
}
function staffToday(){
  var sd=seasonDay(TODAY), wx=FORECASTS[TODAY], rain=rainHour(HOURLY_WX);
  var notes=notesFor(TODAY,{audience:'staff'});
  var byKind=function(k){ return notes.filter(function(n){return n.kind===k;}).sort(function(a,b){return a.at<b.at?-1:1;}); };
  var dayNote=byKind('log').slice(-1)[0];
  var anns=byKind('announcement'), specials=byKind('special'), out=byKind('eighty_six');
  var evts=eventsFor(TODAY).filter(function(e){return e.staffNote;});

  var body=card('<div class="row row--between gap-10">'+wxChip(sd.call,wx.prob,'pill')+
      '<div class="meta right">Feels like '+deg(wx.feels)+(rain?' · '+rain.prob+'% rain around '+hourLabel(rain.hour):'')+'</div></div>'+
    '<div class="grid-3">'+
      '<div class="hour-tile"><span class="label">Gates</span><span class="hour-tile__val">'+(sd.call==='delayed'?'12:00':FARM_HOURS.gates)+'</span></div>'+
      '<div class="hour-tile"><span class="label">Last entry</span><span class="hour-tile__val">'+FARM_HOURS.lastEntry+'</span></div>'+
      '<div class="hour-tile"><span class="label">Close</span><span class="hour-tile__val">'+FARM_HOURS.close+'</span></div>'+
    '</div>'+
    (dayNote?'<div class="small" style="color:var(--ink)">'+esc(dayNote.body)+'</div>':''));

  body+=anns.map(function(a){
    return '<section class="banner banner--dark">'+
      '<div class="row row--between"><div class="label label--gold">From '+esc(a.author)+' · please read</div>'+
      '<div class="meta meta--light">'+(a.ackCount||0)+' of '+a.ackTotal+' read</div></div>'+
      '<div class="body" style="color:var(--farm-cream)">'+esc(a.body)+'</div>'+
      (a.ackedByMe
        ? '<div class="btn btn--ghost" style="height:44px" aria-live="polite">'+I.check({size:16})+'<span>Acknowledged</span></div>'
        : '<button type="button" class="btn btn--gold" style="height:44px" data-act="ack" data-val="'+a.id+'">'+
          I.check({size:16,strokeWidth:2.6})+'<span>Got it</span></button>')+
    '</section>';
  }).join('');

  if(specials.length) body+=card('<div class="label">Specials today · what guests will ask about</div>'+
    specials.map(function(n){ var sp=parseSpecial(n.body);
      return '<div class="special"><div class="col"><span class="list-row__title">'+esc(sp.name)+'</span>'+
        (sp.sub?'<span class="list-row__sub">'+esc(sp.sub)+'</span>':'')+'</div>'+
        (sp.price?'<span class="special__price">'+esc(sp.price)+'</span>':'')+'</div>';
    }).join(''),'','gap:8px');

  if(out.length) body+=warnBanner('Out or limited',esc(out.map(function(n){return n.body;}).join(' ')));

  if(evts.length) body+=card('<div class="label">Happening today</div>'+
    evts.map(function(e){ return '<div class="sched" style="min-height:38px">'+
      '<div class="sched__time sched__time--wide">'+(e.timeLabel||clock(e.start))+'</div>'+
      '<div class="sched__text">'+esc(e.staffNote)+'</div></div>'; }).join(''),'','gap:6px');

  return shell({title:'Today on the farm',
    subtitle:dayLong(TODAY)+(dayNote?' · posted by '+esc(dayNote.author)+' at '+timeShort(dayNote.at):''),body:body});
}

function staffGuide(){
  var STATUS_PILL={Running:'pill--ok','Wait 20 min':'pill--gold',Paused:'pill--warn',Closed:'pill--warn'};
  var q=S.guideQ.trim().toLowerCase(), searching=q.length>0;
  var faq=searching?GUEST_FAQ.filter(function(f){
    return f.q.toLowerCase().indexOf(q)>=0||f.a.toLowerCase().indexOf(q)>=0||f.tags.some(function(t){return t.indexOf(q)>=0;}); }):GUEST_FAQ;
  var shownFaq=(searching||S.allFaq)?faq:faq.slice(0,3);
  var shownAttr=S.allAttractions?ATTRACTIONS:ATTRACTIONS.slice(0,3);

  var body='';
  if(!searching) body+=card('<div class="label">Who to reach</div>'+
    '<div class="grid-3">'+WHO_TO_REACH.map(function(w){
      return '<div class="reach'+(w.urgent?' reach--urgent':'')+'"><span class="reach__name">'+w.label+'</span>'+
        '<span class="reach__sub">'+w.sub+'</span></div>'; }).join('')+'</div>','','gap:8px');

  body+='<div class="col gap-6"><div class="section-label">'+(searching?'Guest questions matching "'+esc(S.guideQ.trim())+'"':'Guest questions')+'</div>'+
    '<div class="card card--list">'+
    (shownFaq.length?shownFaq.map(function(f){
      return '<div class="faq"><span class="faq__q">'+esc(f.q)+'</span><span class="faq__a">'+esc(f.a)+'</span></div>'; }).join('')
      :'<div class="faq"><span class="faq__a">Nothing matches. Try a shorter word, or radio ch 3 for a manager.</span></div>')+
    (!searching?'<button type="button" class="more-row" data-act="allFaq" aria-expanded="'+S.allFaq+'">'+
      '<span>'+(S.allFaq?'Show fewer':'All '+FAQ_TOTAL+' questions')+'</span>'+
      I.chev({size:16,color:'var(--deep-palm)',style:S.allFaq?'transform:rotate(90deg)':''})+'</button>':'')+
    '</div>'+
    (!searching&&S.allFaq?'<div class="meta" style="padding:0 4px">'+GUEST_FAQ.length+' of '+FAQ_TOTAL+' loaded here; the rest are in the SharePoint FAQ.</div>':'')+
  '</div>';

  if(!searching) body+='<div class="col gap-6"><div class="section-label">Attractions · what to tell guests</div>'+
    '<div class="card card--list">'+shownAttr.map(function(a){
      return '<div class="list-row"><span class="list-row__body"><span class="list-row__title">'+a.name+'</span>'+
        '<span class="list-row__sub">'+a.sub+'</span></span>'+
        '<span class="pill '+(STATUS_PILL[a.status]||'pill--muted')+'">'+a.status+'</span></div>'; }).join('')+
    '<button type="button" class="more-row" data-act="allAttr" aria-expanded="'+S.allAttractions+'">'+
      '<span>'+(S.allAttractions?'Show fewer':'All attractions and the map')+'</span>'+
      I.chev({size:16,color:'var(--deep-palm)',style:S.allAttractions?'transform:rotate(90deg)':''})+'</button>'+
    '</div>'+
    (S.allAttractions?'<div class="meta" style="padding:0 4px">The farm map is on the back of the gate handout; a tappable one is coming.</div>':'')+
  '</div>';

  body+='<div class="meta" style="padding:0 4px">Hours, attraction descriptions and FAQ come from the same SharePoint files the website uses, so they only need updating once.</div>';

  var headerExtra='<label class="header-search">'+I.search({size:18,color:'var(--muted)'})+
    '<input type="search" id="guideSearch" value="'+esc(S.guideQ)+'" placeholder="Search: rain check, dogs, strollers, re-entry…" aria-label="Search the guide"></label>';
  return shell({title:'Farm guide',subtitle:'Answers for the questions guests ask you',headerExtra:headerExtra,body:body});
}

function me(){
  var u=USERS[S.role];
  var body=card('<div class="label">Profile</div>'+
    '<div class="num-md">'+esc(u.name)+'</div>'+
    '<div class="small">'+[ROLE_LABEL[S.role],u.zone,u.job].filter(Boolean).join(' · ')+'</div>'+
    '<div class="meta">Preview mode · sample data</div>');
  body+=card('<button type="button" class="toggle'+(S.pushOn?' toggle--on':'')+'" data-act="push" aria-pressed="'+S.pushOn+'">'+
    '<span class="col gap-2" style="text-align:left"><span class="list-row__title">Notifications</span>'+
    '<span class="meta">'+(S.pushOn?'Alerts are on for this device.':'Get the daily note, schedule changes and weather calls as notifications.')+'</span></span>'+
    '<span class="toggle__knob"></span></button>');
  body+=card('<div class="label">Alerts you get</div>'+
    '<div class="small">'+(S.role==='staff'
      ?'The daily note, your schedule changes, and the 7:30 weather call on days you work.'
      :'The weekly brief, sold-out days, low reviews and serious incidents.')+'</div>');
  body+='<button type="button" class="btn btn--outline" data-act="signout">'+I.logout({size:18})+'<span>Sign out</span></button>';
  return shell({title:'Me',subtitle:u.email,body:body});
}
</script>
<script>
function signIn(){
  return '<div class="page"><div class="signin-wrap" style="padding:36px 20px;display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:100%">'+
    '<div style="width:64px;height:64px;border-radius:20px;background:var(--deep-palm);display:flex;align-items:center;justify-content:center">'+
      I.sun({size:34,color:'#F2B830',strokeWidth:2.2})+'</div>'+
    '<div class="col gap-4"><div style="font-family:var(--font-display);font-weight:600;font-size:28px;line-height:32px;color:var(--deep-palm)">Ananda Farm</div>'+
      '<div class="small">One app for the farm: today’s numbers for leadership, shifts and the daily note for the team.</div></div>'+
    card('<div class="label">Preview mode · sample data</div>'+
      '<div class="small">No sign-in needed. Pick a role to see its screens; you can switch again from the header.</div>'+
      '<div class="chips">'+ALL_ROLES.map(function(r){
        return '<button type="button" class="chip" data-act="pickRole" data-val="'+r+'">'+ROLE_LABEL[r]+'</button>'; }).join('')+'</div>')+
    '<div class="meta">Staff accounts are added by the office. Nothing here is public.</div>'+
  '</div></div>';
}

/* ---------------- routing ---------------- */
var ALL_SCREENS=[
  ['/today','Today (role home)'],['/season','Season'],['/brief','Weekly recap'],['/more','More'],
  ['/pacing','Ticket pacing'],['/fnb','F&B zones'],['/retail','Retail'],['/campaigns','Campaigns'],
  ['/reviews','Reviews'],['/incidents','Incidents'],['/calendar','Calendar'],['/log','Log'],
  ['/barn','The Barn'],['/shifts','Staff · shifts'],['/staff/today','Staff · today'],
  ['/staff/guide','Staff · farm guide'],['/me','Me'],['/signin','Sign in']
];
function todayScreen(){
  switch(S.role){
    case 'owner': return ownerCockpit();
    case 'coo': return opsBoard();
    case 'ops': return opsToday();
    case 'fnb': return fbZones('fnb');
    case 'retail': return fbZones('retail');
    case 'marketing': return marketing();
    default: return staffToday();
  }
}
function screenFor(route){
  if(route.indexOf('/brief')===0) return briefApproval();
  switch(route){
    case '/today': return todayScreen();
    case '/season': return season();
    case '/more': return hub();
    case '/pacing': return pacingScreen();
    case '/fnb': return fbZones('fnb');
    case '/retail': return fbZones('retail');
    case '/campaigns': return campaigns();
    case '/reviews': return reviews();
    case '/incidents': return incidents();
    case '/calendar': return calendar();
    case '/log': return logScreen();
    case '/barn': return barn();
    case '/shifts': return staffShifts();
    case '/staff/today': return staffToday();
    case '/staff/guide': return staffGuide();
    case '/me': return me();
    case '/signin': return signIn();
    default: return todayScreen();
  }
}

function renderRail(){
  var tabs=(NAV[S.role]||[]).filter(function(t){return !t[3];}).map(function(t){return t[1];});
  document.getElementById('rail').innerHTML=
    '<div class="rail__brand">Ananda Farm</div>'+
    '<div class="rail__note">Clickable prototype of the leadership and staff app. Every number is the sample data set — Sunday Oct 18, 2026, 7:24 am, week 4 of fall.</div>'+
    '<div class="rail__h">Preview as</div>'+
    '<div class="rail__group">'+ALL_ROLES.map(function(r){
      return '<button type="button" class="rail__btn'+(r===S.role?' rail__btn--on':'')+'" data-act="pickRole" data-val="'+r+'">'+
        '<span>'+ROLE_LABEL[r]+'</span><span class="rail__who">'+USERS[r].name.split(' ')[0]+'</span></button>'; }).join('')+'</div>'+
    '<div class="rail__h">'+ROLE_LABEL[S.role]+'’s tabs</div>'+
    '<div class="rail__group">'+(NAV[S.role]||[]).map(function(t){
      if(t[3]) return '<a class="rail__btn" href="'+t[1]+'" target="_blank" rel="noopener noreferrer"><span>'+t[0]+'</span><span class="rail__who">opens Square</span></a>';
      return '<button type="button" class="rail__btn'+(S.route===t[1]?' rail__btn--on':'')+'" data-go="'+t[1]+'"><span>'+t[0]+'</span></button>'; }).join('')+'</div>'+
    '<div class="rail__h">Every screen</div>'+
    '<div class="rail__group">'+ALL_SCREENS.filter(function(s){return tabs.indexOf(s[0])<0;}).map(function(s){
      return '<button type="button" class="rail__btn'+(S.route===s[0]?' rail__btn--on':'')+'" data-go="'+s[0]+'"><span>'+s[1]+'</span></button>'; }).join('')+'</div>'+
    '<div class="rail__foot">Built from the app in <code>app/src</code>. Season, Campaigns and The Barn are filled in here — they are placeholders in the current build.</div>';
}

function go(route){
  if(route.charAt(0)!=='/') { window.open(route,'_blank','noopener'); return; }
  S.route=route;
  S.briefId = route.indexOf('/brief/')===0 ? route.slice(7) : null;
  if(route.indexOf('/brief')===0){ S.ownerView=false; S.showAllSource=false; }
  render();
  var sc=document.getElementById('app'); if(sc) sc.scrollTop=0;
}
function toast(msg){
  var el=document.getElementById('toastEl');
  if(!el){ el=document.createElement('div'); el.id='toastEl';
    el.style.cssText='position:absolute;left:16px;right:16px;bottom:'+(84)+'px;background:var(--deep-palm);color:var(--farm-cream);'+
      'border-radius:12px;padding:11px 14px;font-size:13px;line-height:18px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.28)';
    document.querySelector('.device').appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ if(el) el.style.opacity='0'; },2600);
  el.style.transition='opacity .25s';
}

function render(){
  document.getElementById('app').innerHTML=screenFor(S.route);
  renderTabs();
  renderRail();
  var noTabs=S.route==='/signin';
  document.getElementById('tabbar').style.display=noTabs?'none':'grid';
  var rs=document.getElementById('roleSwitch');
  if(rs) rs.addEventListener('change',function(e){ setRole(e.target.value); });
  var gs=document.getElementById('guideSearch');
  if(gs){ gs.addEventListener('input',function(e){ S.guideQ=e.target.value; var pos=e.target.selectionStart;
    render(); var n=document.getElementById('guideSearch'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } }); }
  var nk=document.getElementById('noteKind');
  if(nk) nk.addEventListener('change',function(e){ S.noteKind=e.target.value; });
  var nb=document.getElementById('noteBody');
  if(nb) nb.addEventListener('input',function(e){ S.noteBody=e.target.value; });
}
function setRole(r){
  S.role=r; S.route=HOME[r]; S.briefId=null; S.ownerView=false; S.heroView='yesterday';
  render(); var sc=document.getElementById('app'); if(sc) sc.scrollTop=0;
}

/* ---------------- actions ---------------- */
var ACTIONS={
  heroView:function(v){ S.heroView=v; },
  seasonView:function(v){ S.seasonView=v; },
  pickRole:function(v){ setRole(v); return true; },
  call:function(v){
    if(!can(S.role,'weather.call')) return;
    S.seasonDays[TODAY]={day:TODAY,week:4,call:v,calledAt:NOW.toISOString()};
    toast(v==='rainout'?'Rained out — Jen and the owners have been alerted.'
      :v==='delayed'?'Delayed to noon — the notice is posted to the staff channel.'
      :'Open as usual — saved to today’s record.');
  },
  approve:function(v){
    S.briefs=S.briefs.map(function(b){ return b.id===v
      ? Object.assign({},b,{status:'published',publishedAt:NOW.toISOString(),approvedBy:USERS[S.role].name.split(' ')[0]}) : b; });
    toast('Published. The owners just got a push.');
  },
  resetBrief:function(v){
    S.briefs=S.briefs.map(function(b){ return b.id===v
      ? Object.assign({},b,{status:'draft',publishedAt:null,approvedBy:null}) : b; });
  },
  ownerView:function(){ S.ownerView=true; },
  myView:function(){ S.ownerView=false; },
  toggleSource:function(){ S.showAllSource=!S.showAllSource; },
  ack:function(v){
    S.notes=S.notes.map(function(n){ return n.id===v&&!n.ackedByMe
      ? Object.assign({},n,{ackedByMe:true,ackCount:(n.ackCount||0)+1}) : n; });
    toast('Thanks — Jen can see you read it.');
  },
  toStaff:function(){ S.noteToStaff=!S.noteToStaff; },
  addNote:function(){
    var body=S.noteBody.trim();
    if(!body){ toast('Write the note first.'); return; }
    var toStaff=S.noteToStaff||['announcement','special','eighty_six'].indexOf(S.noteKind)>=0;
    S.notes=[{id:'n-'+Date.now(),day:TODAY,author:USERS[S.role].name.split(' ')[0],
      audience:toStaff?['staff','leadership']:['leadership'],kind:S.noteKind,body:body,
      ack:S.noteKind==='announcement',at:NOW.toISOString(),
      ackCount:S.noteKind==='announcement'?0:undefined,ackTotal:S.noteKind==='announcement'?58:undefined,
      ackedByMe:false}].concat(S.notes);
    S.noteBody=''; S.noteKind='log'; S.noteToStaff=false;
    toast(toStaff?'Added. Staff see it on their Today screen.':'Added to the leadership log.');
  },
  allFaq:function(){ S.allFaq=!S.allFaq; },
  allAttr:function(){ S.allAttractions=!S.allAttractions; },
  push:function(){ S.pushOn=!S.pushOn; },
  addCal:function(){ toast('A .ics download opens here in the real app.'); },
  signout:function(){ S.route='/signin'; render(); return true; }
};

document.addEventListener('click',function(e){
  var goEl=e.target.closest('[data-go]');
  if(goEl){ e.preventDefault(); go(goEl.getAttribute('data-go')); return; }
  var actEl=e.target.closest('[data-act]');
  if(actEl){
    var fn=ACTIONS[actEl.getAttribute('data-act')];
    if(fn){ e.preventDefault(); if(fn(actEl.getAttribute('data-val'))!==true) render(); }
  }
});

render();
</script>
</body></html>
